name: Check DTEK schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: dtek-outage-monitor
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for DTEK WAF fallback
        run: python -m playwright install --with-deps chromium
      - name: Read DTEK and notify Telegram
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DTEK_GROUP: ${{ vars.DTEK_GROUP || '6.2' }}
          REMINDER_MINUTES: ${{ vars.REMINDER_MINUTES || '0' }}
          QUEUE_APPROVAL: ${{ vars.QUEUE_APPROVAL || '' }}
          DTEK_WAF_BROWSER: "1"
          ANNOUNCEMENTS_ENABLED: ${{ vars.ANNOUNCEMENTS_ENABLED || 'true' }}
          DTEK_ADDRESS_JSON: ${{ secrets.DTEK_ADDRESS_JSON }}
          STATE_PATH: bot_state.json
        run: python bot.py --once
      - name: Save notification state even if later notifications fail
        if: always() && steps.notify.outcome != 'skipped'
        env:
          GITHUB_STATE_PUSH_TOKEN: ${{ github.token }}
        run: |
          if [[ -f bot_state.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Store notification state [skip ci]"
              # Do not persist the write-capable GitHub token in checkout.
              # Only the state-saving step receives this token.
              cat > "$RUNNER_TEMP/svitlo-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' 'x-access-token' ;;
            *Password*) printf '%s' "$GITHUB_STATE_PUSH_TOKEN" ;;
          esac
          ASKPASS
              chmod 700 "$RUNNER_TEMP/svitlo-askpass"
              GIT_ASKPASS="$RUNNER_TEMP/svitlo-askpass" GIT_TERMINAL_PROMPT=0 \
                git push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:main
            fi
          fi
