name: Read-only policy verification
on:
  push:
    paths:
      - '.github/workflows/policy-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Evaluate DTEK messages without Telegram
        env:
          DTEK_WAF_BROWSER: '1'
          DTEK_GROUP: '6.2'
          PYTHONPATH: .
        run: python scripts/policy_probe.py
