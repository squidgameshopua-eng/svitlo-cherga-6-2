name: Inspect official DTEK notices (read only)
on:
  push:
    paths:
      - .github/workflows/probe-notices.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_dtek_announcements.py
