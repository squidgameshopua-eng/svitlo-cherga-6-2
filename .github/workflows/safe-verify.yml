name: One-time safe live parser verification
on:
  push:
    paths:
      - .github/workflows/safe-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read DTEK without Telegram access
        env:
          DTEK_WAF_BROWSER: '1'
          PYTHONPATH: .
        run: python scripts/safe_verify.py
